name: Backend tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "db/**"
      - "service/**"
      - "desktop/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "db/**"
      - "service/**"
      - "desktop/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for offscreen Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch torchvision
          pip install opencv-python-headless numpy pytest supabase requests PySide6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Write local configs
        run: python3 tools/write_supabase_env.py

      - name: Unit and integration tests
        run: pytest tests/test_core.py -q

      - name: Auth, roles and tenant isolation
        run: python3 tools/test_rls.py

      - name: Sync engine tests
        run: python3 tools/test_sync.py

      - name: Desktop offscreen smoke
        run: python3 -m desktop.launcher --smoke
